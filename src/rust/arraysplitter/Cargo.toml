[package]
name = "arraysplitter_rs"
version = "0.1.0"
edition = "2021"
authors = ["Aleksey Komissarov <ad3002@gmail.com>"]
description = "De novo decomposition of satellite DNA arrays into monomers"
license = "BSD-3-Clause"

[dependencies]
# CLI
clap = { version = "4.4", features = ["derive"] }

# Parallelism
rayon = "1.8"

# Progress bar
indicatif = "0.17"

# Bioinformatics
bio = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Collections
indexmap = "2.1"
rustc-hash = "1.1"

# String distance
triple_accel = "0.4"

# Statistics
statrs = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
