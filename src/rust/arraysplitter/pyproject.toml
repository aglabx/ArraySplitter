[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "arraysplitter"
version = "1.5.0"
description = "De novo decomposition of satellite DNA arrays into monomers (Rust implementation)"
readme = "../../../README.md"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Aleksey Komissarov", email = "ad3002@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.8"
keywords = ["bioinformatics", "satellite-dna", "centromere", "tandem-repeats", "genomics"]

[project.urls]
Homepage = "https://github.com/aglabx/ArraySplitter"
Repository = "https://github.com/aglabx/ArraySplitter"
Issues = "https://github.com/aglabx/ArraySplitter/issues"

[tool.maturin]
# Build as standalone binary (not Python bindings)
bindings = "bin"
# Strip symbols for smaller binaries
strip = true
# Include these binaries
manifest-path = "Cargo.toml"
