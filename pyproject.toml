[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "arraysplitter"
dynamic = ["version"]
description = "De Novo Decomposition of Satellite DNA Arrays into Monomers within Telomere-to-Telomere Assemblies"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Aleksey Komissarov", email = "ad3002@gmail.com"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = ["bioinformatics", "satellite-dna", "centromere", "tandem-repeats", "genomics"]

[project.urls]
Homepage = "https://github.com/aglabx/ArraySplitter"
Repository = "https://github.com/aglabx/ArraySplitter"
Issues = "https://github.com/aglabx/ArraySplitter/issues"

[tool.maturin]
# Path to Cargo.toml (source of truth for version)
manifest-path = "src/rust/arraysplitter/Cargo.toml"
# Build as standalone binary (not Python bindings)
bindings = "bin"
# Strip symbols for smaller binaries
strip = true
